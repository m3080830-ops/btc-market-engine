name: BTC ETH sync TP and ETH SHORT guard backtest (Nov 19-26, M1 chronological)
on:
  push:
    branches: [test/sync-tp-eth-short-guard]
    paths:
      - "strategy.py"
      - "main.py"
      - "tools/historical_close_sync_compare.py"
      - ".github/workflows/h1-m15-close-sync-backtest.yml"
  workflow_dispatch:
    inputs:
      start_utc:
        description: Inclusive UTC start
        required: false
        default: "2026-11-19T00:00:00+00:00"
      end_utc:
        description: Exclusive UTC end
        required: false
        default: "2026-11-26T00:00:00+00:00"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      START_UTC: ${{ inputs.start_utc || '2026-11-19T00:00:00+00:00' }}
      END_UTC: ${{ inputs.end_utc || '2026-11-26T00:00:00+00:00' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load exact Nov 23 baseline strategy
        run: |
          mkdir -p backtest-input
          git show 23196f23b665ddd23cfed1da90be89f643d35dc4:strategy.py > backtest-input/strategy_nov23.py
          git show 5a6009f4911e6b5d8c779a9a26fd622e72f7b27a:strategy.py > backtest-input/strategy_sync_before_tp.py
      - name: Syntax check
        run: python -m py_compile strategy.py tools/historical_close_sync_compare.py
      - name: Run close-time synchronization comparison
        run: python tools/historical_close_sync_compare.py
      - name: Upload complete data and results
        uses: actions/upload-artifact@v4
        with:
          name: btc-market-engine-sync-tp-eth-guard-${{ github.run_id }}
          path: backtest-output/
          if-no-files-found: error
          retention-days: 90

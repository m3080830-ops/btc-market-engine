name: MEXC M15 consolidation filter comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download fresh public MEXC candles and run comparison
        run: python backtest/run_m15_consolidation.py
      - name: Upload reproducible data and results
        uses: actions/upload-artifact@v4
        with:
          name: mexc-m15-consolidation-nov-01-18-${{ github.run_id }}
          path: data/mexc/
          if-no-files-found: error
          retention-days: 30

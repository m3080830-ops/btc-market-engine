name: Six-position MEXC candle audit (read-only)

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: "Start UTC (ISO-8601)"
        required: true
        default: "2026-11-20T00:00:00Z"
      end_utc:
        description: "End UTC (ISO-8601)"
        required: true
        default: "2026-11-24T00:00:00Z"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      START_UTC: ${{ inputs.start_utc }}
      END_UTC: ${{ inputs.end_utc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download public MEXC Futures M1 candles and locate screenshot prices
        run: python tools/audit_six_positions.py
      - name: Upload audit data
        uses: actions/upload-artifact@v4
        with:
          name: six-position-mexc-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

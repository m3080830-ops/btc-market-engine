name: Six-position MEXC candle audit (read-only)

on:
  push:
    branches: ["main"]
    paths:
      - "tools/audit_six_positions.py"
      - ".github/workflows/six-position-candle-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download timestamp-anchored public MEXC Futures candles
        run: python tools/audit_six_positions.py
      - name: Upload candle windows and timestamp context
        uses: actions/upload-artifact@v4
        with:
          name: six-position-mexc-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

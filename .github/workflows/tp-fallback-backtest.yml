name: H1 structural TP fallback comparison (read-only)
on:
  push:
    branches:
      - "fix/tp-meaningful-h1-fallback-10-24nov"
    paths:
      - "strategy.py"
      - "tools/historical_backtest_compare.py"
      - ".github/workflows/tp-fallback-backtest.yml"
  workflow_dispatch:
    inputs:
      start_utc:
        description: "Start UTC inclusive"
        required: true
        default: "2026-11-10T00:00:00+00:00"
      end_utc:
        description: "End UTC exclusive"
        required: true
        default: "2026-11-24T00:00:00+00:00"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tp-meaningful-h1-fallback-10-24nov
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load exact Nov 23 baseline snapshot
        run: |
          mkdir -p backtest-input
          git show 23196f23b665ddd23cfed1da90be89f643d35dc4:strategy.py > backtest-input/strategy_nov23.py
          git show faf509c38e800ade3d0102145bf6235d6909e646^:strategy.py > backtest-input/strategy_tp_old.py
      - name: Run BTC and ETH comparison on identical MEXC candles
        env:
          START_UTC: ${{ inputs.start_utc || '2026-11-10T00:00:00+00:00' }}
          END_UTC: ${{ inputs.end_utc || '2026-11-24T00:00:00+00:00' }}
        run: python tools/historical_backtest_compare.py
      - name: Upload report, trades and candle data
        uses: actions/upload-artifact@v4
        with:
          name: btc-market-engine-tp-fallback-${{ github.run_id }}
          path: backtest-output/
          if-no-files-found: error

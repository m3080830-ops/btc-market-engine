name: BTC M15 structure A-B audit

on:
  workflow_dispatch:
  push:
    branches:
      - "test/m15-structure-ab"
    paths:
      - "strategy.py"
      - "tests/m15_structure_ab.py"
      - ".github/workflows/m15-structure-ab.yml"

permissions:
  contents: read

jobs:
  signal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v
      - name: Run MEXC public-data A/B signal audit (read-only)
        run: python tests/m15_structure_ab.py
      - name: Upload A/B report
        uses: actions/upload-artifact@v4
        with:
          name: btc-m15-structure-ab-report
          path: ab-results/m15-structure-ab.json
          if-no-files-found: error
